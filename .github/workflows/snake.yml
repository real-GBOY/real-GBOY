# Save this file in your profile repo at: .github/workflows/snake.yml
# Generates a contribution "snake" from your own data and pushes the SVG to the
# "output" branch, so the image is served from YOUR repo and never rate-limits.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs (themed cyan/amber)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23f0883e&color_dots=%23161b22,%230c2d3a,%23134b5f,%232b8fb0,%2338bdf8
            dist/github-snake-dark.svg?color_snake=%23f0883e&color_dots=%23161b22,%230c2d3a,%23134b5f,%232b8fb0,%2338bdf8

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
