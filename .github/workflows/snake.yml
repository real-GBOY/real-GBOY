# Save this file in your profile repo at: .github/workflows/snake.yml
# It generates a contribution "snake" animation from your own data and
# pushes the SVG to an "output" branch, so the image is served from YOUR
# repository and never depends on a rate-limited third-party service.

name: Generate Snake Animation

on:
  schedule:
    # Re-generates twice a day so it stays current
    - cron: "0 */12 * * *"
  workflow_dispatch:   # lets you run it manually from the Actions tab
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
